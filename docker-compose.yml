version: "3.9"

x-mtls-common-env: &mtls-common-env
  MTLS_ENABLED: ${MTLS_ENABLED:-false}
  MTLS_CERT_DIR: /etc/mtls
  MTLS_REJECT_UNAUTHORIZED: ${MTLS_REJECT_UNAUTHORIZED:-true}
  MTLS_REQUIRE_CLIENT_CERT: ${MTLS_REQUIRE_CLIENT_CERT:-true}

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/01-init-multiple-databases.sql:ro
    networks:
      - cab-network

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - cab-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: a1
    ports:
      - "5050:80"
    networks:
      - cab-network

  kafka:
    image: apache/kafka:4.2.0-rc2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-kafka}:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - cab-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: taxi-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      - kafka
    networks:
      - cab-network

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - cab-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cab-network

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: auth-service
      DB_HOST: postgres
      DB_PORT: 5432
      USER_SERVICE_URL: http://user-service:3002
      DRIVER_SERVICE_URL: http://driver-service:3005
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - postgres
      - user-service
      - driver-service
    networks:
      - cab-network

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "3002:3002"
    env_file:
      - ./services/user-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: user-service
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - postgres
    networks:
      - cab-network

  pricing-service:
    build: ./services/pricing-service
    container_name: pricing-service
    ports:
      - "3003:3003"
    env_file:
      - ./services/pricing-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: pricing-service
    volumes:
      - ./security/certs:/etc/mtls:ro
    networks:
      - cab-network

  booking-service:
    build: ./services/booking-service
    container_name: booking-service
    ports:
      - "3004:3004"
    env_file:
      - ./services/booking-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: booking-service
      MONGO_URI: mongodb://mongo:27017/booking_db
      PRICING_SERVICE_URL: http://pricing-service:3003
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - mongo
      - kafka
      - pricing-service
    networks:
      - cab-network

  driver-service:
    build: ./services/driver-service
    container_name: driver-service
    ports:
      - "3005:3005"
    env_file:
      - ./services/driver-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: driver-service
      POSTGRES_URL: postgres://driver_user:driver_pass@postgres:5432/driver_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - cab-network

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "3006:3006"
    env_file:
      - ./services/payment-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: payment-service
      POSTGRES_URL: postgres://payment_user:payment_pass@postgres:5432/payment_db
      KAFKA_BROKER: kafka:29092
      RIDE_SERVICE_URL: http://ride-service:3007
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - postgres
      - kafka
      - ride-service
    networks:
      - cab-network

  ride-service:
    build: ./services/ride-service
    container_name: ride-service
    ports:
      - "3007:3007"
    env_file:
      - ./services/ride-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: ride-service
      MONGO_URI: mongodb://mongo:27017/ride_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
      USER_SERVICE_URL: http://user-service:3002
      DRIVER_SERVICE_URL: http://driver-service:3005
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - mongo
      - redis
      - kafka
      - user-service
      - driver-service
    networks:
      - cab-network

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "3008:3008"
    env_file:
      - ./services/notification-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: notification-service
      MONGO_URI: mongodb://mongo:27017/notification_db
      KAFKA_BROKER: kafka:29092
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - mongo
      - kafka
    networks:
      - cab-network

  review-service:
    build: ./services/review-service
    container_name: review-service
    ports:
      - "3009:3009"
    env_file:
      - ./services/review-service/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: review-service
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - postgres
    networks:
      - cab-network

  ai-matching-service:
    build: ./services/ai-matching-service
    container_name: ai-matching-service
    ports:
      - "3010:3010"
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: ai-matching-service
      PORT: 3010
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      OLLAMA_ENABLED: "true"
      OLLAMA_MCP_ENABLED: "true"
      OLLAMA_MCP_COMMAND: node
      OLLAMA_MCP_ARGS: "[\"./ollamaMcpServer.js\"]"
      OLLAMA_MCP_TOOL: ollama.generate
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_MS: 15000
      OLLAMA_MAX_CANDIDATES: 8
      OLLAMA_MCP_HTTP_FALLBACK: "false"
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - kafka
      - redis
      - ollama
    networks:
      - cab-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    environment:
      <<: *mtls-common-env
      MTLS_SERVICE_NAME: api-gateway
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      PRICING_SERVICE_URL: http://pricing-service:3003
      BOOKING_SERVICE_URL: http://booking-service:3004
      DRIVER_SERVICE_URL: http://driver-service:3005
      RIDE_SERVICE_URL: http://ride-service:3007
      PAYMENT_SERVICE_URL: http://payment-service:3006
      REVIEW_SERVICE_URL: http://review-service:3009
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      AI_SERVICE_URL: http://ai-matching-service:3010
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./security/certs:/etc/mtls:ro
    depends_on:
      - auth-service
      - user-service
      - pricing-service
      - booking-service
      - driver-service
      - ride-service
      - payment-service
      - review-service
      - ai-matching-service
    networks:
      - cab-network

  cab-ui:
    build:
      context: ./cab-ui
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: cab-ui
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - cab-network

networks:
  cab-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
