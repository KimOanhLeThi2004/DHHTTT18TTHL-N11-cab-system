name: CD-CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: kietlu
  STACK_NAME: taxi-booking
  STACK_FILE: docker-stack.deploy.yml

jobs:
  docker-push:
    name: Docker push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile
          - image: cab-ui
            context: ./cab-ui
            dockerfile: ./cab-ui/Dockerfile
          - image: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - image: user-service
            context: ./services/user-service
            dockerfile: ./services/user-service/Dockerfile
          - image: booking-service
            context: ./services/booking-service
            dockerfile: ./services/booking-service/Dockerfile
          - image: driver-service
            context: ./services/driver-service
            dockerfile: ./services/driver-service/Dockerfile
          - image: payment-service
            context: ./services/payment-service
            dockerfile: ./services/payment-service/Dockerfile
          - image: pricing-service
            context: ./services/pricing-service
            dockerfile: ./services/pricing-service/Dockerfile
          - image: review-service
            context: ./services/review-service
            dockerfile: ./services/review-service/Dockerfile
          - image: ride-service
            context: ./services/ride-service
            dockerfile: ./services/ride-service/Dockerfile
          - image: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
          - image: ai-matching-service
            context: ./services/ai-matching-service
            dockerfile: ./services/ai-matching-service/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push (cab-ui)
        if: matrix.image == 'cab-ui'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}

      - name: Build and push (backend services)
        if: matrix.image != 'cab-ui'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  swarm-deploy:
    name: Swarm deploy
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check swarm deploy secrets
        id: guard
        shell: bash
        env:
          SWARM_SSH_HOST: ${{ secrets.SWARM_SSH_HOST }}
          SWARM_SSH_USER: ${{ secrets.SWARM_SSH_USER }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
        run: |
          if [ -z "$SWARM_SSH_HOST" ] || [ -z "$SWARM_SSH_USER" ] || [ -z "$SWARM_SSH_KEY" ]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Missing SWARM_SSH_HOST/SWARM_SSH_USER/SWARM_SSH_KEY, skip deploy."
          else
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload stack file and deploy
        if: steps.guard.outputs.deploy_enabled == 'true'
        shell: bash
        env:
          SWARM_SSH_PORT: ${{ secrets.SWARM_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SWARM_SSH_KEY }}" > ~/.ssh/swarm_key
          chmod 600 ~/.ssh/swarm_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -p "$SWARM_SSH_PORT" "${{ secrets.SWARM_SSH_HOST }}" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/swarm_key -P "$SWARM_SSH_PORT" \
            "${{ env.STACK_FILE }}" \
            "${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}:/tmp/${{ env.STACK_FILE }}"

          DEPLOY_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$DEPLOY_TAG" ]; then
            DEPLOY_TAG="latest"
          fi

          ssh -i ~/.ssh/swarm_key -p "$SWARM_SSH_PORT" \
            "${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}" "\
              docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' -p '${{ secrets.DOCKERHUB_TOKEN }}' docker.io && \
              IMAGE_TAG=$DEPLOY_TAG docker stack deploy -c /tmp/${{ env.STACK_FILE }} ${{ env.STACK_NAME }} --with-registry-auth \
            "
