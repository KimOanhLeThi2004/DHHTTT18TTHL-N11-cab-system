groups:
  - name: cab-system-alerts
    rules:
      - alert: HighErrorRate
        expr: responses_5xx > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate detected"

      - alert: HighLatencyProxy
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A service is down"
