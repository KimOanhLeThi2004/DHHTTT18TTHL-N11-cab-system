global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:3000"]
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:3001"]
  - job_name: user-service
    static_configs:
      - targets: ["user-service:3002"]
  - job_name: pricing-service
    static_configs:
      - targets: ["pricing-service:3003"]
  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:3004"]
  - job_name: driver-service
    static_configs:
      - targets: ["driver-service:3005"]
  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:3006"]
  - job_name: ride-service
    static_configs:
      - targets: ["ride-service:3007"]
  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:3008"]
  - job_name: ai-matching-service
    static_configs:
      - targets: ["ai-matching-service:3010"]
